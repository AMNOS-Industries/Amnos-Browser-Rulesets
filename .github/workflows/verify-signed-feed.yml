name: Verify public signed feed

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify signed feed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout complete append-only history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate HSM ECDSA signatures, exact payload hashes and release-state invariants
        run: python3 scripts/verify_signed_feed.py
      - name: Test immutable release history and reject rollback regressions
        run: python3 -m unittest discover -s scripts -p 'test_release_policy.py' -v
      - name: Reject changes to previously published versioned files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BASE="$(git merge-base HEAD origin/main)"
          else
            BASE="$(git rev-parse HEAD^)"
          fi
          python3 scripts/verify_append_only.py "$BASE"
